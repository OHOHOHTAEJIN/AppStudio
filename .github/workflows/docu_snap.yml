name: docu_snap CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/docu_snap/**'
      - 'packages/app_core/**'
      - 'scripts/patch_android.py'
      - '.github/workflows/docu_snap.yml'
  pull_request:
    paths:
      - 'apps/docu_snap/**'
      - 'packages/app_core/**'
      - 'scripts/patch_android.py'
      - '.github/workflows/docu_snap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate Android host
        working-directory: apps/docu_snap
        run: flutter create --platforms=android --org=com.uikstudio --project-name=docu_snap --no-pub .
      - name: Patch platform configuration
        run: python3 scripts/patch_android.py apps/docu_snap
      - name: Install dependencies
        working-directory: apps/docu_snap
        run: flutter pub get
      - name: Generate Android app launcher icon
        working-directory: apps/docu_snap
        run: dart run flutter_launcher_icons
      - name: Analyze
        working-directory: apps/docu_snap
        run: flutter analyze
      - name: Widget tests
        working-directory: apps/docu_snap
        run: flutter test
