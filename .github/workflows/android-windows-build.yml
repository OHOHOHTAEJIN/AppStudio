name: AppStudio - Build Android on Home Windows
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/android-windows-build.yml'
  workflow_dispatch:
    inputs:
      app:
        description: Android app to build
        type: choice
        required: true
        default: all
        options:
          - all
          - privacy_mosaic
          - pixel_slim
          - docu_snap
          - shift_pay

permissions:
  contents: read

concurrency:
  group: appstudio-windows-android
  cancel-in-progress: false

jobs:
  build-on-home-pc:
    if: github.repository == 'OHOHOHTAEJIN/AppStudio'
    runs-on: [self-hosted, Windows, X64, appstudio-android]
    timeout-minutes: 180
    # Trust only the already-installed Flutter SDK for this job, without editing
    # the service account's global Git configuration.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: D:/dev/flutter
      # Keep Pub and Gradle caches on the same drive as the Android project.
      PUB_CACHE: D:/gh-runner-appstudio/_work/_pub_cache
      GRADLE_USER_HOME: D:/gh-runner-appstudio/_work/_gradle_cache
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout exact GitHub commit to the home PC
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Detect Android SDK for Windows service account
        run: |
          .\scripts\windows\detect-android-sdk.ps1

      - name: Detect Java JDK for Android Gradle
        run: |
          .\scripts\windows\detect-java.ps1

      - name: Validate local Flutter/Android toolchain
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-Command flutter -ErrorAction Stop | Select-Object -ExpandProperty Source
          flutter --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter is not usable in the runner service account' }

      - name: Build optimized ARM64 release APKs on this machine
        env:
          APPSTUDIO_SELECTION: ${{ inputs.app || 'all' }}
        run: |
          .\scripts\windows\build-apps.ps1 -App $env:APPSTUDIO_SELECTION

      - name: Verify APK outputs before upload
        env:
          APPSTUDIO_SELECTION: ${{ inputs.app || 'all' }}
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'appstudio-apks'
          if (-not (Test-Path -LiteralPath $dir)) { throw "APK output directory missing: $dir" }
          $apks = @(Get-ChildItem -LiteralPath $dir -Filter '*-arm64-release.apk' -File)
          $expected = if ($env:APPSTUDIO_SELECTION -eq 'all') { 4 } else { 1 }
          $apks | ForEach-Object { Write-Host "[ARM64 RELEASE] $($_.Name) $($_.Length) bytes" }
          if (-not (Test-Path (Join-Path $dir 'size-report.csv'))) { throw 'Missing size report' }
          if ($apks.Count -ne $expected) { throw "Expected $expected APK(s), found $($apks.Count)" }

      - name: Upload generated APKs to GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appstudio-release-arm64-${{ github.run_number }}
          path: ${{ github.workspace }}/appstudio-apks/
          if-no-files-found: error
          retention-days: 21
      
      - name: Upload release symbols as a separate artifact
        uses: actions/upload-artifact@v4
        with:
          name: appstudio-android-symbols-${{ github.run_number }}
          path: ${{ github.workspace }}/appstudio-symbols/
          if-no-files-found: error
          retention-days: 30
