name: pixel_slim CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/pixel_slim/**'
      - 'packages/app_core/**'
      - 'scripts/patch_android.py'
      - '.github/workflows/pixel_slim.yml'
  pull_request:
    paths:
      - 'apps/pixel_slim/**'
      - 'packages/app_core/**'
      - 'scripts/patch_android.py'
      - '.github/workflows/pixel_slim.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate Android host
        working-directory: apps/pixel_slim
        run: flutter create --platforms=android --org=com.uikstudio --project-name=pixel_slim --no-pub .
      - name: Patch platform configuration
        run: python3 scripts/patch_android.py apps/pixel_slim
      - name: Install dependencies
        working-directory: apps/pixel_slim
        run: flutter pub get
      - name: Analyze
        working-directory: apps/pixel_slim
        run: flutter analyze
      - name: Widget tests
        working-directory: apps/pixel_slim
        run: flutter test
      - name: Build debug APK (manual only)
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/pixel_slim
        run: flutter build apk --debug
      - name: Upload debug APK (manual only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pixel_slim-debug-apk
          path: apps/pixel_slim/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
