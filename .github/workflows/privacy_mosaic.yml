name: privacy_mosaic CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/privacy_mosaic/**'
      - 'packages/app_core/**'
      - 'scripts/patch_android.py'
      - '.github/workflows/privacy_mosaic.yml'
  pull_request:
    paths:
      - 'apps/privacy_mosaic/**'
      - 'packages/app_core/**'
      - 'scripts/patch_android.py'
      - '.github/workflows/privacy_mosaic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate Android host
        working-directory: apps/privacy_mosaic
        run: flutter create --platforms=android --org=com.uikstudio --project-name=privacy_mosaic --no-pub .
      - name: Patch platform configuration
        run: python3 scripts/patch_android.py apps/privacy_mosaic
      - name: Install dependencies
        working-directory: apps/privacy_mosaic
        run: flutter pub get
      - name: Generate new launcher art
        working-directory: apps/privacy_mosaic
        run: dart run tool/generate_icon.dart privacy_mosaic
      - name: Generate Android launcher resources
        working-directory: apps/privacy_mosaic
        run: dart run flutter_launcher_icons
      - name: Analyze
        working-directory: apps/privacy_mosaic
        run: flutter analyze
      - name: Widget and calculation tests
        working-directory: apps/privacy_mosaic
        run: flutter test
