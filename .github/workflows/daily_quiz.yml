name: daily_quiz CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/daily_quiz/**'
      - 'packages/app_core/**'
      - 'scripts/patch_android.py'
      - '.github/workflows/daily_quiz.yml'
  pull_request:
    paths:
      - 'apps/daily_quiz/**'
      - 'packages/app_core/**'
      - 'scripts/patch_android.py'
      - '.github/workflows/daily_quiz.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate Android host
        working-directory: apps/daily_quiz
        run: flutter create --platforms=android --org=com.uikstudio --project-name=daily_quiz --no-pub .
      - name: Patch platform configuration
        run: python3 scripts/patch_android.py apps/daily_quiz
      - name: Install dependencies
        working-directory: apps/daily_quiz
        run: flutter pub get
      - name: Generate Android app launcher icon
        working-directory: apps/daily_quiz
        run: dart run flutter_launcher_icons
      - name: Analyze
        working-directory: apps/daily_quiz
        run: flutter analyze
      - name: Widget tests
        working-directory: apps/daily_quiz
        run: flutter test
      - name: Build debug APK (manual only)
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/daily_quiz
        run: flutter build apk --debug
      - name: Upload debug APK (manual only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: daily_quiz-debug-apk
          path: apps/daily_quiz/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
