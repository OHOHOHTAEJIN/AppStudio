name: privacy_mosaic
description: Offline photo masking and privacy editor
version: 0.1.0+1
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../../packages/app_core
  image: '>=4.10.0 <4.11.0'
  image_picker: '>=1.2.0 <1.2.3'
  google_mlkit_face_detection: '>=0.13.2 <0.14.0'
  google_mlkit_text_recognition: '>=0.15.1 <0.16.0'
  path_provider: '>=2.1.5 <2.1.6'
  share_plus: '>=10.1.4 <11.0.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/launcher.png
  adaptive_icon_background: "#072736"
  adaptive_icon_foreground: assets/icon/launcher.png
  adaptive_icon_foreground_inset: 16
