name: pixel_slim
description: Offline image optimizer
version: 0.2.0+2
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../../packages/app_core
  image_picker: '>=1.2.0 <1.2.3'
  flutter_image_compress: '>=2.4.0 <3.0.0'
  video_compress_next: '>=0.1.1 <0.2.0'
  path_provider: '>=2.1.5 <2.1.6'
  share_plus: '>=10.1.4 <11.0.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/launcher.jpg
  adaptive_icon_background: "#062C2A"
  adaptive_icon_foreground: assets/icon/launcher.jpg
  adaptive_icon_foreground_inset: 16
