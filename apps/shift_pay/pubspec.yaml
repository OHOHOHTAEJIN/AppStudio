name: shift_pay
description: Offline work shifts and estimated salary calculator
version: 0.1.0+1
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../../packages/app_core
  shared_preferences: '>=2.5.3 <2.5.6'
  path_provider: '>=2.1.5 <2.1.6'
  share_plus: '>=10.1.4 <11.0.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  image: '>=4.10.0 <4.11.0'
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/launcher.png
  adaptive_icon_background: "#102043"
  adaptive_icon_foreground: assets/icon/launcher.png
  adaptive_icon_foreground_inset: 16
