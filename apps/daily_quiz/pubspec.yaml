name: daily_quiz
description: Daily 10-question trivia
version: 0.2.0+2
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../../packages/app_core
  shared_preferences: '>=2.5.3 <2.5.6'
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/launcher.jpg
  adaptive_icon_background: "#3C0B2B"
  adaptive_icon_foreground: assets/icon/launcher.jpg
  adaptive_icon_foreground_inset: 16
